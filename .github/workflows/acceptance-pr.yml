name: Acceptance on pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Branch mode installs from this repository's URL, so a branch that
  # lives only in a fork cannot be installed.
  fork:
    name: Acceptance skipped (fork)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the skip
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          msg="Acceptance (PR) does not run for branches in forks (${HEAD_REPO:-deleted fork}): branch mode installs from this repository. Push the branch to this repository to run it."
          echo "::notice title=Acceptance (PR) skipped::${msg}"
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Read the PR version
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve version from package.xml
        id: version
        run: |
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' package.xml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read <version> from package.xml"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "PR head version: $VERSION (expected tag v$VERSION)"

      - name: Check the changelog section
        run: python3 -m unittest tests/unit/test_version_files.py -q

  pack:
    name: Pack the bundle
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Pack the Claude Desktop bundle
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack mcp-stdio-shim freecad-mcp-bridge.mcpb

      - name: Upload the packed bundle
        uses: actions/upload-artifact@v4
        with:
          name: freecad-mcp-bridge.mcpb
          path: freecad-mcp-bridge.mcpb
          if-no-files-found: error

  install_verify:
    name: Acceptance (PR)
    needs: [version, pack]
    uses: ./.github/workflows/install-verify.yml
    with:
      install_mode: branch
      install_branch: ${{ github.head_ref }}
      install_tag: ${{ needs.version.outputs.tag }}
      acceptance: true
      coverage: true
      verify_bundle: true
