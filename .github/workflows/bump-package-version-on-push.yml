name: Bump package version on push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    name: Bump package.xml patch
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.head_commit.message, '[bump version]') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to ') &&
      !startsWith(github.event.head_commit.message, 'chore: bump package.xml z to ')
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

      - name: Bump patch, date, and Cargo.toml
        env:
          BUMP_PACKAGE_Z_AUTHORIZED: "true"
        run: bash "${GITHUB_WORKSPACE}/scripts/bump-package-z.sh"