name: Bump package version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump package.xml patch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure running on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Bump package version workflow must be run on the main branch."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

      - name: Bump patch, date, and Cargo.toml
        env:
          BUMP_PACKAGE_Z_AUTHORIZED: "true"
        run: bash "${GITHUB_WORKSPACE}/scripts/bump-package-z.sh"