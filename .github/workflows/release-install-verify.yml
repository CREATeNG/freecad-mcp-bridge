name: Release install verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install and verify
        required: true
        default: v0.1.11
      mode:
        description: Install mode (tag or index_zip)
        required: true
        default: tag
        type: choice
        options:
          - tag
          - index_zip
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify - ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_INSTALL_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_INSTALL_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'tag' }}
      RELEASE_INSTALL_REPO: https://github.com/CREATeNG/freecad-mcp-bridge
      RELEASE_INSTALL_NAME: freecad-mcp-bridge
      RELEASE_INSTALL_GUI_DELAY_MS: "5000"
      RELEASE_INSTALL_TOOLBAR_TIMEOUT_MS: "30000"
      RELEASE_INSTALL_WAIT_MS: "180000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            qt_platform: ""
            isolate_home: true
          - os: windows-latest
            os-name: windows
            qt_platform: offscreen
            isolate_home: true
          - os: macos-latest
            os-name: macos
            qt_platform: offscreen
            isolate_home: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        if: runner.os != 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: freecad-ci
          python-version: "3.11"
          miniforge-version: latest
          channels: conda-forge

      - name: Install FreeCAD (conda)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: conda install -y "freecad=1.1.0" git

      - name: Install FreeCAD (winget)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id FreeCAD.FreeCAD --version 1.1.0 `
            --accept-package-agreements --accept-source-agreements `
            --disable-interactivity --silent
          if ($LASTEXITCODE -gt 2) {
            throw "winget install failed with exit code $LASTEXITCODE"
          }

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Resolve FreeCAD launcher (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          if command -v freecad >/dev/null 2>&1; then
            FC_BIN="$(command -v freecad)"
          elif command -v FreeCAD >/dev/null 2>&1; then
            FC_BIN="$(command -v FreeCAD)"
          elif [ -n "${CONDA_PREFIX:-}" ] && [ -x "${CONDA_PREFIX}/bin/freecad" ]; then
            FC_BIN="${CONDA_PREFIX}/bin/freecad"
          elif [ -n "${CONDA_PREFIX:-}" ] && [ -x "${CONDA_PREFIX}/bin/FreeCAD" ]; then
            FC_BIN="${CONDA_PREFIX}/bin/FreeCAD"
          else
            echo "FreeCAD binary not found in PATH or conda env"
            conda list freecad || true
            ls -la "${CONDA_PREFIX}/bin" 2>/dev/null || true
            exit 1
          fi
          echo "FREECAD_BIN=${FC_BIN}" >> "${GITHUB_ENV}"
          echo "Using FreeCAD: ${FC_BIN}"

      - name: Prepare isolated FreeCAD profile
        shell: bash -l {0}
        run: |
          echo "FC_CI_HOME=${RUNNER_TEMP}/freecad-ci-home" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/freecad-ci-home"

      - name: Install addon via Addon Manager (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          if [ "${{ matrix.isolate_home }}" = "true" ]; then
            export HOME="${FC_CI_HOME}"
            export USERPROFILE="${FC_CI_HOME}"
          fi
          SCRIPT="${GITHUB_WORKSPACE}/scripts/test_install.py"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a timeout 900 "${FREECAD_BIN}" "${SCRIPT}"
          else
            export LIBGL_ALWAYS_SOFTWARE=1
            perl -e 'alarm shift; exec @ARGV' 900 "${FREECAD_BIN}" "${SCRIPT}"
          fi
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}

      - name: Install addon via Addon Manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: |
          $env:USERPROFILE = $env:FC_CI_HOME
          $env:HOME = $env:FC_CI_HOME
          $script = Join-Path $env:GITHUB_WORKSPACE "scripts\test_install.py"
          $freecadBin = @(
            (Join-Path $env:ProgramFiles "FreeCAD 1.1\bin\FreeCAD.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "FreeCAD 1.1\bin\FreeCAD.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\FreeCAD 1.1\bin\FreeCAD.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $freecadBin) {
            throw "FreeCAD.exe not found after winget install"
          }
          if (-not (Test-Path -LiteralPath $script)) {
            throw "test_install.py not found: '$script'"
          }
          Write-Host "Launching '$freecadBin' with '$script'"
          $proc = Start-Process -FilePath $freecadBin -ArgumentList @($script) -PassThru
          if (-not $proc.WaitForExit(900000)) {
            $proc.Kill($true)
            throw "FreeCAD timed out after 15 minutes running test_install.py"
          }
          if ($proc.ExitCode -ne 0) {
            throw "FreeCAD exited with code $($proc.ExitCode) running test_install.py"
          }

      - name: Verify addon after FreeCAD restart (Unix)
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          if [ "${{ matrix.isolate_home }}" = "true" ]; then
            export HOME="${FC_CI_HOME}"
            export USERPROFILE="${FC_CI_HOME}"
          fi
          SCRIPT="${GITHUB_WORKSPACE}/scripts/test_verify.py"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a timeout 900 "${FREECAD_BIN}" "${SCRIPT}"
          else
            export LIBGL_ALWAYS_SOFTWARE=1
            perl -e 'alarm shift; exec @ARGV' 900 "${FREECAD_BIN}" "${SCRIPT}"
          fi
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}

      - name: Verify addon after FreeCAD restart (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: |
          $env:USERPROFILE = $env:FC_CI_HOME
          $env:HOME = $env:FC_CI_HOME
          $script = Join-Path $env:GITHUB_WORKSPACE "scripts\test_verify.py"
          $freecadBin = @(
            (Join-Path $env:ProgramFiles "FreeCAD 1.1\bin\FreeCAD.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "FreeCAD 1.1\bin\FreeCAD.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\FreeCAD 1.1\bin\FreeCAD.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $freecadBin) {
            throw "FreeCAD.exe not found after winget install"
          }
          if (-not (Test-Path -LiteralPath $script)) {
            throw "test_verify.py not found: '$script'"
          }
          Write-Host "Launching '$freecadBin' with '$script'"
          $proc = Start-Process -FilePath $freecadBin -ArgumentList @($script) -PassThru
          if (-not $proc.WaitForExit(900000)) {
            $proc.Kill($true)
            throw "FreeCAD timed out after 15 minutes running test_verify.py"
          }
          if ($proc.ExitCode -ne 0) {
            throw "FreeCAD exited with code $($proc.ExitCode) running test_verify.py"
          }