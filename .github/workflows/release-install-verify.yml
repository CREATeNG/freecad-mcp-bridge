name: Release install verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install and verify
        required: true
        default: v0.1.11
      mode:
        description: Install mode (tag, index_zip, or main)
        required: true
        default: tag
        type: choice
        options:
          - tag
          - index_zip
          - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/install-verify-reusable.yml
    with:
      install_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'tag' }}
      install_tag: ${{ github.event.inputs.tag || github.ref_name }}
      fail_fast: false