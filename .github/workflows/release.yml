name: Release Orchestrator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Stage release candidate on main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.commit_sha.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with origin main
        run: git pull --ff-only origin main

      - name: Resolve version from package.xml
        id: version
        run: |
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' package.xml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read <version> from package.xml"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.xml must use x.y.z (found: $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag v$VERSION)"

      - name: Verify tag does not exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "$TAG")" ]; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Validate Claude Desktop bundle manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate claude-desktop-shim/manifest.json

      - name: Record release candidate commit
        id: commit_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  install_verify:
    name: Install verify (pre-tag gate)
    needs: prepare
    uses: ./.github/workflows/install-verify.yml
    with:
      install_mode: main
      install_tag: ${{ needs.prepare.outputs.tag }}
      fail_fast: true

  publish:
    name: Tag and publish release notes
    needs: [prepare, install_verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push tag and publish release notes
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH_AUTHORIZED: "true"
          RELEASE_VERIFIED_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash "${GITHUB_WORKSPACE}/scripts/release-publish-orchestrator.sh"

  install_verify_tag:
    name: Install verify (tag path)
    needs: [prepare, publish]
    uses: ./.github/workflows/install-verify.yml
    with:
      install_mode: tag
      install_tag: ${{ needs.prepare.outputs.tag }}
      fail_fast: true

  addons_index_pr:
    name: Open FreeCAD Addon Index PR
    needs: [prepare, install_verify_tag]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    outputs:
      index_pr_status: ${{ steps.index_pr.outputs.index_pr_status }}
      index_pr_url: ${{ steps.index_pr.outputs.index_pr_url }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Dispatch Index PR on fork and update release notes
        id: index_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDONS_INDEX_DISPATCH_TOKEN: ${{ secrets.ADDONS_INDEX_DISPATCH_TOKEN }}
          ADDONS_INDEX_DISPATCH_AUTHORIZED: "true"
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash "${GITHUB_WORKSPACE}/scripts/trigger-addons-index-pr.sh"

  bump:
    name: Bump development patch on main
    needs: [prepare, install_verify_tag]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

      - name: Bump development patch on main
        env:
          BUMP_PACKAGE_Z_AUTHORIZED: "true"
        run: bash "${GITHUB_WORKSPACE}/scripts/bump-package-z.sh"