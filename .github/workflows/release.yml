name: Release Orchestrator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os-name }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Ensure running on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release Orchestrator workflow must be run on the main branch."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build release binary
        run: |
          cd rust_mcp_server
          cargo build --release --target ${{ matrix.platform.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os-name }}
          path: rust_mcp_server/target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin-name }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            bin-name: freecad-mcp-bridge
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            bin-name: freecad-mcp-bridge
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            bin-name: freecad-mcp-bridge.exe

  prepare:
    name: Stage release candidate on main
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.commit_sha.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with origin main
        run: git pull --ff-only origin main

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts/linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/windows

      - name: Install binaries into bin/
        run: |
          install -D artifacts/linux/freecad-mcp-bridge bin/linux/freecad-mcp-bridge
          install -D artifacts/macos/freecad-mcp-bridge bin/macos/freecad-mcp-bridge
          install -D artifacts/windows/freecad-mcp-bridge.exe bin/win32/freecad-mcp-bridge.exe
          chmod +x bin/linux/freecad-mcp-bridge bin/macos/freecad-mcp-bridge

      - name: Resolve version from package.xml
        id: version
        run: |
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' package.xml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read <version> from package.xml"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.xml must use x.y.z (found: $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag v$VERSION)"

      - name: Verify tag does not exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "$TAG")" ]; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Commit release binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/linux bin/macos bin/win32
          if git diff --staged --quiet; then
            echo "bin/ already up to date on main"
          else
            git commit -m "Sync release binaries for ${{ steps.version.outputs.tag }}"
          fi

      - name: Push release candidate to main
        run: git push origin main

      - name: Record release candidate commit
        id: commit_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  install_verify:
    name: Install verify (release gate)
    needs: prepare
    uses: ./.github/workflows/install-verify-reusable.yml
    with:
      install_mode: main
      install_tag: ${{ needs.prepare.outputs.tag }}
      fail_fast: true

  publish:
    name: Tag and publish release
    needs: [prepare, install_verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag and bump development z
        id: publish
        env:
          RELEASE_PUBLISH_AUTHORIZED: "true"
          RELEASE_VERIFIED_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash "${GITHUB_WORKSPACE}/scripts/release-publish-orchestrator.sh"

      - name: Checkout tagged tree for release assets
        run: git checkout "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.publish.outputs.release_tag }}"
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.publish.outputs.release_tag }}"
          cp bin/linux/freecad-mcp-bridge freecad-mcp-bridge-linux
          cp bin/macos/freecad-mcp-bridge freecad-mcp-bridge-macos
          cp bin/win32/freecad-mcp-bridge.exe freecad-mcp-bridge-windows.exe
          gh release upload "$TAG" \
            freecad-mcp-bridge-linux \
            freecad-mcp-bridge-macos \
            freecad-mcp-bridge-windows.exe \
            --clobber