name: Release Orchestrator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Queue, never cancel: a second run waits rather than shipping over
# the first.
concurrency:
  group: release-orchestrator
  cancel-in-progress: false

jobs:
  prepare:
    name: Stage release candidate on main
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.commit_sha.outputs.sha }}
      do_release: ${{ steps.gate.outputs.do_release }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # A push releases only when the version changed since the previous
      # tip and the diff is the version files plus CHANGELOG.md.
      # Dispatch is the retry: it ships the current main when that
      # version has no tag.
      - name: Decide whether this run releases
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
            echo "Dispatch: retry the release of the current main."
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No previous tip to compare. Not a release."
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Previous tip $BEFORE is not in this checkout."
            exit 1
          fi
          version_at() {
            local xml
            xml="$(git show "$1:package.xml")"
            printf '%s\n' "$xml" \
              | sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' \
              | head -1
          }
          OLD="$(version_at "$BEFORE")"
          NEW="$(version_at "$SHA")"
          if [ "$OLD" = "$NEW" ]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "package.xml version unchanged ($NEW). Not a release."
            exit 0
          fi
          if [ -z "$NEW" ]; then
            echo "package.xml on $SHA has no <version>."
            exit 1
          fi
          diff_names="$(git diff --name-only "$BEFORE" "$SHA")"
          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            case "$changed" in
              package.xml|mcp-stdio-shim/manifest.json|mcp-stdio-shim/package.json|CHANGELOG.md)
                ;;
              *)
                echo "Version changed ($OLD -> $NEW) but the push also changes $changed."
                echo "A version pull request changes only the version files and CHANGELOG.md."
                exit 1
                ;;
            esac
          done <<EOF
          $diff_names
          EOF
          if ! printf '%s\n' "$diff_names" | grep -qx 'CHANGELOG.md'; then
            echo "Version changed ($OLD -> $NEW) but CHANGELOG.md is not in the diff."
            exit 1
          fi
          echo "do_release=true" >> "$GITHUB_OUTPUT"
          echo "Version release $OLD -> $NEW at $SHA"

      - name: Check the changelog section
        if: steps.gate.outputs.do_release == 'true'
        run: python3 -m unittest tests/unit/test_version_files.py -q

      - name: Pin the commit this run releases
        if: steps.gate.outputs.do_release == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git pull --ff-only origin main
          else
            git checkout --detach "${{ github.sha }}"
          fi

      - name: Resolve version from package.xml
        id: version
        if: steps.gate.outputs.do_release == 'true'
        run: |
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' package.xml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read <version> from package.xml"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.xml must use x.y.z (found: $VERSION)"
            exit 1
          fi
          BRANCH=$(sed -n 's/.*<url branch="\([^"]*\)" type="repository">.*/\1/p' package.xml | head -1)
          if [ "$BRANCH" != "release" ]; then
            echo "package.xml's repository url branch must be release (found: $BRANCH)."
            echo "The Addon Manager installs that branch, not the Index's git_ref."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag v$VERSION)"

      - name: Verify tag does not exist
        if: steps.gate.outputs.do_release == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "$TAG")" ]; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Validate Claude Desktop bundle manifest
        if: steps.gate.outputs.do_release == 'true'
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate mcp-stdio-shim/manifest.json

      - name: Check the Claude Desktop shim's tool list matches the addon's
        if: steps.gate.outputs.do_release == 'true'
        run: python3 scripts/check_shim_tools.py

      - name: Record release candidate commit
        id: commit_sha
        if: steps.gate.outputs.do_release == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pack the Claude Desktop bundle
        id: bundle
        if: steps.gate.outputs.do_release == 'true'
        run: |
          set -euo pipefail
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcp-stdio-shim freecad-mcp-bridge.mcpb
          sha="$(sha256sum freecad-mcp-bridge.mcpb | awk '{print $1}')"
          echo "bundle_sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "Packed freecad-mcp-bridge.mcpb (${sha})"

      - name: Upload the packed bundle
        if: steps.gate.outputs.do_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: freecad-mcp-bridge.mcpb
          path: freecad-mcp-bridge.mcpb
          if-no-files-found: error

  install_verify:
    name: Install verify (pre-tag gate)
    needs: prepare
    if: needs.prepare.outputs.do_release == 'true'
    uses: ./.github/workflows/install-verify.yml
    with:
      install_mode: main
      install_tag: ${{ needs.prepare.outputs.tag }}
      fail_fast: true
      acceptance: true
      verify_bundle: true

  publish:
    name: Tag and publish release notes
    needs: [prepare, install_verify]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.do_release == 'true'
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download the tested bundle
        uses: actions/download-artifact@v4
        with:
          name: freecad-mcp-bridge.mcpb
          path: ${{ runner.temp }}/bundle

      - name: Push tag and publish release notes
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH_AUTHORIZED: "true"
          RELEASE_VERIFIED_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_BUNDLE_PATH: ${{ runner.temp }}/bundle/freecad-mcp-bridge.mcpb
          RELEASE_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle_sha256 }}
        run: bash "${GITHUB_WORKSPACE}/scripts/release-publish-orchestrator.sh"

  install_verify_tag:
    name: Install verify (tag path)
    needs: [prepare, publish]
    if: needs.prepare.outputs.do_release == 'true'
    uses: ./.github/workflows/install-verify.yml
    with:
      install_mode: tag
      install_tag: ${{ needs.prepare.outputs.tag }}
      fail_fast: true
      acceptance: true

  promote:
    name: Move the release branch to the verified commit
    needs: [prepare, install_verify_tag]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.do_release == 'true'
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward release
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        # A plain push: GitHub refuses it unless release is an ancestor of the
        # verified commit, so release only ever moves forward.
        run: git push origin "${RELEASE_SHA}:refs/heads/release"
