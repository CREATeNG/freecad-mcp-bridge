name: Release Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os-name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            bin-name: freecad-mcp-bridge
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            bin-name: freecad-mcp-bridge
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            bin-name: freecad-mcp-bridge.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build release binary
        run: |
          cd rust_mcp_server
          cargo build --release --target ${{ matrix.platform.target }}

      - name: Upload binary to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: rust_mcp_server/target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin-name }}
          asset_name: freecad-mcp-bridge-${{ matrix.platform.os-name }}-${{ matrix.platform.bin-name }}
          tag: ${{ github.ref }}
          overwrite: true
