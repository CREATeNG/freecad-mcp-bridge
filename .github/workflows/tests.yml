name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install coverage
        run: pip install coverage==7.6.1

      - name: Run unit tests
        run: python -m coverage run -m unittest discover -s tests/unit -t . -v

      - name: Coverage report
        if: always()
        run: |
          python -m coverage report -m --include='freecad/mcp_bridge/*' | tee coverage.txt
          {
            echo '### Unit test coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  shim:
    name: Shim (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run shim tests
        run: node --test --experimental-test-coverage tests/shim/*.test.js
